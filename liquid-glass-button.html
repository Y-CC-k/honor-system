<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass CTA Button</title>
<style>
  /* ================================
     背景：深色漸變，讓霓虹發光更突出
     ================================ */
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    overflow: hidden;
  }

  /* 背景裝飾光暈 */
  body::before {
    content: "";
    position: absolute;
    top: -20%;
    left: -20%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
    filter: blur(80px);
    z-index: 0;
  }
  body::after {
    content: "";
    position: absolute;
    bottom: -20%;
    right: -20%;
    width: 50vw;
    height: 50vw;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
    filter: blur(80px);
    z-index: 0;
  }

  /* ================================
     液態玻璃 CTA 按鈕主體
     ================================ */
  .liquid-btn {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 32px;
    border-radius: 50px;

    /* 液態玻璃：半透明白霧表面 */
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    /* 極細邊緣微細細節 */
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow:
      /* 外層霓虹發光 */
      0 0 40px rgba(139, 92, 246, 0.45),
      0 0 80px rgba(139, 92, 246, 0.25),
      /* 內層高光與立體感 */
      inset 0 1px 0 rgba(255, 255, 255, 0.6),
      inset 0 0 20px rgba(255, 255, 255, 0.2),
      /* 柔和下陰 */
      0 8px 24px rgba(0, 0, 0, 0.35);

    /* 現代字體 */
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    text-decoration: none;

    cursor: pointer;
    outline: none;
    user-select: none;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);

    /* 防止點擊高亮 */
    -webkit-tap-highlight-color: transparent;
  }

  /* ================================
     玻璃邊緣微細細節：頂部高光條
     ================================ */
  .liquid-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0) 60%
    );
    border-radius: 50px 50px 0 0;
    pointer-events: none;
    z-index: 2;
  }

  /* ================================
     折射光澤：動態流動光帶
     ================================ */
  .liquid-btn::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -100%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      45deg,
      transparent 0%,
      rgba(255, 255, 255, 0.3) 25%,
      transparent 50%,
      rgba(255, 255, 255, 0.3) 75%,
      transparent 100%
    );
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    animation: liquid-glow 4s ease-in-out infinite;
  }

  @keyframes liquid-glow {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
    50% { transform: translateX(100%) translateY(100%) rotate(45deg); opacity: 0.6; }
    100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
  }

  /* ================================
     懸停狀態：霓虹強度提升，按鈕微凸
     ================================ */
  .liquid-btn:hover {
    background: rgba(255, 255, 255, 0.32);
    border-color: rgba(255, 255, 255, 0.55);
    transform: translateY(-3px) scale(1.02);
    box-shadow:
      0 0 60px rgba(139, 92, 246, 0.65),
      0 0 100px rgba(139, 92, 246, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 0 25px rgba(255, 255, 255, 0.3),
      0 12px 32px rgba(0, 0, 0, 0.4);
  }

  .liquid-btn::after:hover {
    animation-duration: 2s;
    opacity: 0.8;
  }

  /* ================================
     按下狀態：下陷壓扁效果
     ================================ */
  .liquid-btn:active {
    transform: translateY(0) scale(0.98);
    background: rgba(255, 255, 255, 0.12);
    box-shadow:
      0 0 30px rgba(139, 92, 246, 0.3),
      inset 0 2px 10px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  /* ================================
     圖示（可選）
     ================================ */
  .btn-icon {
    font-size: 18px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  /* ================================
     輔助文字
     ================================ */
  .hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.3px;
    text-align: center;
  }
</style>
</head>
<body>

  <!-- 液態玻璃 CTA 按鈕 -->
  <a href="#" class="liquid-btn">
    <span class="btn-icon">🚀</span>
    立即體驗
  </a>

  <div class="hint">Liquid Glass UI • Neon Glow • 3D App Button</div>

</body>
</html>
