<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>榮譽積點管理系統</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 隱藏輸入框（RFID 讀卡機＝鍵盤輸入裝置） -->
  <form id="cardForm">
    <input id="keyInput" type="text" inputmode="none" autocomplete="off" maxlength="12">
    <button type="submit" hidden></button>
  </form>

  <!-- ===== 主內容區：左右 1:4 ===== -->
  <main class="shell-main">
    <div class="content-zone">
      <!-- 左區：個人資訊卡（1/5 = 20%） -->
      <section class="card left-zone">
        <div class="card-head">
          <span class="card-tag">學生資訊</span>
          <div class="card-avatar-wrap"><img id="userImg" src="assets/boy_01.svg" alt="avatar"></div>
        </div>
        <div class="card-body">
          <!-- 查詢輸入區（旁邊可直接輸入卡號/學號） -->
          <div class="query-box">
            <input type="text" id="queryInput" placeholder="輸入卡號/學號" maxlength="12" autocomplete="off">
            <button type="button" id="queryBtn">查詢</button>
          </div>
          <p class="user_name"><span id="stuName">　　　</span><span class="user_id_num" id="stuId">---</span></p>
          <div class="score-grid">
            <div class="score-item score-A" id="scoreA">
              <div class="score-label">英文 / 讀經</div>
              <div class="score-value">0</div>
            </div>
            <div class="score-item score-B" id="scoreB">
              <div class="score-label">閱讀</div>
              <div class="score-value">0</div>
            </div>
            <div class="score-item score-C" id="scoreC">
              <div class="score-label">跑步</div>
              <div class="score-value">0</div>
            </div>
            <div class="score-item score-D" id="scoreD">
              <div class="score-label">榮譽</div>
              <div class="score-value">0</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 右區：四個排行榜面板由左至右橫向平分（4/5 = 80%） -->
      <section class="card right-zone">
        <div class="card-head">
          <span class="card-tag">排行榜 Top 10</span>
          <button class="cta-button" id="refreshBtn">🔄 重新整理</button>
        </div>
        <div class="card-body">
          <div class="scoring" id="scoring"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- 狀態提示 -->
  <div class="source-tag" id="sourceTag"></div>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
