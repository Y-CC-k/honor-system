<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>榮譽積點管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 隱藏輸入框（RFID 讀卡機＝鍵盤輸入裝置），原版 inputmode=none + autofocus -->
  <form id="cardForm">
    <input id="keyInput" type="text" inputmode="none" autocomplete="off" maxlength="12">
    <button type="submit" hidden></button>
  </form>

  <!-- 學生資訊面板（原版 scoring_user） -->
  <div class="scoring_user">
    <div class="user_img"><img id="userImg" src="assets/boy_01.svg" alt=""></div>
    <div class="user_info">
      <p class="user_name"><span id="stuName" class="stu-name">　　　</span><span class="user_id_num" id="stuId">---</span></p>
      <div class="ant-row" style="margin: -8px -12px 8px;">
        <div class="ant-col ant-col-12" style="padding: 8px 12px;"><div class="score E" id="scoreA" title="英文/讀經">0</div></div>
        <div class="ant-col ant-col-12" style="padding: 8px 12px;"><div class="score B" id="scoreB" title="閱讀">0</div></div>
        <div class="ant-col ant-col-12" style="padding: 8px 12px;"><div class="score C" id="scoreC" title="跑步">0</div></div>
        <div class="ant-col ant-col-12" style="padding: 8px 12px;"><div class="score D" id="scoreD" title="榮譽">0</div></div>
      </div>
    </div>
  </div>

  <!-- 排行榜主區（原版 scoring） -->
  <div class="scoring" id="scoring" style="height: 947px;"></div>

  <!-- 跑馬燈（原版 banner） -->
  <div id="bannerWrap"><img id="bannerImg" src="assets/banner-splash.svg" alt=""></div>

  <!-- 狀態提示 -->
  <div class="source-tag" id="sourceTag"></div>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
